<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sol Tenax</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon-16x16.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sixtyfour&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <audio id="bg-music">
      <source src="./sounds/menu_music2-trimmed.wav" type="audio/wav" />
    </audio>
    <div class="container">
      <div class="glitch-img-wrapper">
        <img
          src="./images/STL_black_tr_light.png"
          alt="Sol Tenax Logo"
          class="logo-main"
        />
        <img
          src="./images/STL_black_tr_light.png"
          alt=""
          class="logo-main layer-1"
        />
        <img
          src="./images/STL_black_tr_light.png"
          alt=""
          class="logo-main layer-2"
        />
      </div>
      <p><span class="glitch" data-text="SOON">SOON</span></p>
    </div>
  </body>
  <script src="./script.js"></script>
</html>
